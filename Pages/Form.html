<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Creating Form</h2>
    <form action=""
        <label for="firstname">FirstName</label>
    <br>
    <input type="text" name="" id="firstname">
    <br>
    <div>
         <label for="">LastName</label>
        <input type="text" name="" id="LastName" required>
    </div>
    <div>
        <label for="Email">Email</label>
        <input type="Email" name="" id="Email">
    </div>
   <div>
    <label for="password">password</label>
    <input type="password" name="" id="password" maxlength="15">
   </div>
   <div>
    <label for="telephone">Phone No.</label>
    <input type="tel" name="" id="telephone">
   </div>
   <div>
    <label for="">Choose your Gender</label>
    <br>
    <label for="">
        <input type="radio" name="Gender" id="" value="Male">
        Male
    </label>
    <label for="">
        <input type="radio" name="Gender" id="" value="Female">
        Female
    </label>
    <label for="">
        <input type="radio" name="Gender" id="" value="Others">
        Others
    </label>
   </div>
   <div>
    <label for="Experience">Select your Experience Level</label>
    <select name="Experience-Level" id="Experience" multiple>
        <option value="Beginner">Beginner</option>
        <option value="Intermediate">Intermediate</option>
        <option value="Expert">Expert</option>
    </select>
   </div>
   <div>
    <label for="">Select your Hobbies</label>
    <label for="">
        <input type="checkbox" name="Hobby" id="" value="Reading">
        Reading
    </label>
    <label for="">
        <input type="checkbox" name="Hobby" id="" value="Swimming">
        Swimming
    </label>
    <label for="">
        <input type="checkbox" name="Hobby" id="" value="Coding">
        Coding
    </label>
   </div>
   <label for="">Comments</label>
   <textarea name="" id="" placeholder="Enter your comment"></textarea>
   <button type="reset">Clear</button>
   <button type="submit">Submit</button>
   <fieldset>
    <legend>Personal Data</legend>
    <div>
        <label for="">Full Name</label>
        <input type="text" name="" id="">
    </div>
   </fieldset>
</form>
</body>
</html>
